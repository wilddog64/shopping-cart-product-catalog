---
apiVersion: batch/v1
kind: Job
metadata:
  name: product-catalog-seed
  namespace: shopping-cart-apps
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: shopping-cart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: shopping-cart
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: seed
        image: python:3.12-alpine
        command:
          - sh
          - -c
          - |
            pip install --quiet --target /tmp/packages psycopg2-binary
            PYTHONPATH=/tmp/packages python3 /scripts/seed.py
        envFrom:
        - configMapRef:
            name: product-catalog-config
        - secretRef:
            name: product-catalog-secrets
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: scripts
        configMap:
          name: product-catalog-seed-script
      - name: tmp
        emptyDir: {}
