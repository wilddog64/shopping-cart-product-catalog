---
apiVersion: batch/v1
kind: Job
metadata:
  name: product-catalog-fts-index
  namespace: shopping-cart-apps
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/component: fts-index
    app.kubernetes.io/part-of: shopping-cart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/component: fts-index
        app.kubernetes.io/part-of: shopping-cart
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: indexer
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            PGPASSWORD="${DB_PASSWORD}" psql \
              -h "${DB_HOST}" -p "${DB_PORT}" \
              -U "${DB_USERNAME}" -d "${DB_NAME}" \
              -v ON_ERROR_STOP=1 <<'SQL'
            CREATE OR REPLACE FUNCTION products_search_vector(
              name text,
              description text,
              category text
            )
            RETURNS tsvector
            LANGUAGE sql
            IMMUTABLE
            AS $$
              SELECT to_tsvector(
                'pg_catalog.english',
                concat_ws(' ', name, description, category)
              );
            $$;

            CREATE INDEX IF NOT EXISTS products_fts_idx
              ON products
              USING GIN(products_search_vector(name, description, category));
            SQL
        envFrom:
        - configMapRef:
            name: product-catalog-config
        - secretRef:
            name: product-catalog-secrets
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
